<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Тесты логики</title>
<style>body{font-family:system-ui;padding:16px}.ok{color:#0a6b3d}.fail{color:#b3261e;font-weight:700}</style></head>
<body>
<h1>Тесты логики</h1>
<pre id="out"></pre>
<script type="module">
import * as cy from './js/cycle.js';
import { suggest } from './js/progression.js';
import { programName, isStrength, programExercises, upcomingSwaps, aquaPlan, availableExerciseIds } from './js/programs.js';
import { EXERCISES, EX_BY_ID } from './js/data.js';
import { needsEquipment, withoutEquipment, activeConditions, verdict, alternatives, analogMachines } from './js/catalog.js';
import { pairNote, pairsFor, suggestFor, setAnalysis, historyBalance, workoutFromSet, supersetStep, canSuperset, pairRestSec, roleOf, regionOf, isBack, isPress, PAIR_REST } from './js/catalog-plan.js';
import { EXERCISE_META, MUSCLES, EQUIPMENT, RISK_TAGS, CONDITIONS } from './js/catalog-data.js';
import { parseHealth, stepsToKm, kmToSteps, walkSteps, sessionPoolMin, swimMinutesOn, clubVisitDates, visitCounts, walkTotals, stepsByDay, stepsByWeek, healthInfo, hoursShortText, backupStatus } from './js/stats.js';
import { bodyRecords, bodyChange, bodyDue, fatToTarget, fatZone, checkBodyRecord, devicesUsed, byDevice, HISTORY_SEED } from './js/body.js';
import { S } from './js/state.js';
import { historyInUnit } from './js/progression.js';

const out = document.getElementById('out');
let pass = 0, fail = 0;
function eq(name, got, want) {
  const ok = JSON.stringify(got) === JSON.stringify(want);
  ok ? pass++ : fail++;
  out.innerHTML += `<span class="${ok ? 'ok' : 'fail'}">${ok ? '✓' : '✗'} ${name}${ok ? '' : ` — получено ${JSON.stringify(got)}, ожидалось ${JSON.stringify(want)}`}</span>\n`;
}

const START = '2026-10-26';
// недели и фазы
eq('23.10 — вводная неделя 0', cy.weekOf('2026-10-23', START), 0);
eq('26.10 — неделя 1', cy.weekOf('2026-10-26', START), 1);
eq('01.11 (вс) — неделя 1', cy.weekOf('2026-11-01', START), 1);
eq('09.11 — неделя 3', cy.weekOf('2026-11-09', START), 3);
eq('23.11 — неделя 5', cy.weekOf('2026-11-23', START), 5);
eq('18.01 — неделя 13', cy.weekOf('2027-01-18', START), 13);
eq('сдвиг на неделю с недели 3', cy.weekOf('2026-11-16', START, [{ fromRawWeek: 3, weeks: 1 }]), 3);
eq('фаза недели 4', cy.phaseOf(4), 'p1');
eq('фаза недели 5', cy.phaseOf(5), 'p2');
eq('фаза недели 13', cy.phaseOf(13), 'deload');
eq('подходы: неделя 0', cy.setsFor(0, 'p1'), 2);
eq('подходы: неделя 1', cy.setsFor(1, 'p1'), 2);
eq('подходы: неделя 3', cy.setsFor(3, 'p1'), 3);
eq('подходы: неделя 5', cy.setsFor(5, 'p2'), 3);
eq('подходы: неделя 13', cy.setsFor(13, 'deload'), 2);
eq('контрольный замер 23.10 → 0', cy.checkpointNear('2026-10-23', START), 0);
eq('контрольный замер 23.11 → 4', cy.checkpointNear('2026-11-23', START), 4);
eq('не контрольный день', cy.checkpointNear('2026-11-05', START), null);
eq('день недели 23.10 = пятница', cy.weekday('2026-10-23'), 5);
eq('начало недели 23.10', cy.weekStart('2026-10-23'), '2026-10-19');

// какую тренировку предложить
eq('пятница вводной недели → А', cy.plannedSlot('2026-10-23', 0, new Set()).slot, 'A');
eq('вторник → А по расписанию', cy.plannedSlot('2026-10-27', 1, new Set()), { slot: 'A', scheduled: true });
eq('среда после пропущенного Вт → А вне расписания', cy.plannedSlot('2026-10-28', 1, new Set()), { slot: 'A', scheduled: false });
eq('воскресенье, А и кардио сделаны → Б', cy.plannedSlot('2026-11-01', 1, new Set(['A', 'cardio'])), { slot: 'B', scheduled: true });
eq('четверг, А не сделана → кардио по плану', cy.plannedSlot('2026-10-29', 1, new Set()).slot, 'cardio');

// подсказка веса
const R = { min: 12, max: 15 };
const s = (weight, reps, breathHold = false) => ({ weight, reps, breathHold });
const h = (date, sets, extra = {}) => ({ date, phase: 'p1', sets, ...extra });
const base = { range: R, step: 1, mode: 'double', today: '2026-11-02' };
eq('калибровка без истории', suggest({ ...base, history: [] }).kind, 'calibration');
eq('все на верхе → +1', suggest({ ...base, history: [h('2026-10-30', [s(10, 15), s(10, 15)])] }).weight, 11);
eq('breathHold → −1', suggest({ ...base, history: [h('2026-10-30', [s(10, 15), s(10, 15, true)])] }).weight, 9);
eq('меньше минимума → тот же, добрать', suggest({ ...base, history: [h('2026-10-30', [s(10, 13), s(10, 11)])] }), { kind: 'addReps', weight: 10, lastSets: [13, 11], reason: 'Тот же вес — добрать повторы' });
eq('внутри диапазона → тот же', suggest({ ...base, history: [h('2026-10-30', [s(10, 14), s(10, 13)])] }).weight, 10);
eq('лёгкий день не учитывается', suggest({ ...base, history: [h('2026-10-31', [s(8, 15), s(8, 15)], { lightDay: true }), h('2026-10-30', [s(10, 13), s(10, 13)])] }).weight, 10);
eq('разгрузка не учитывается', suggest({ ...base, history: [h('2026-10-31', [s(8, 12)], { phase: 'deload' }), h('2026-10-30', [s(10, 15), s(10, 15)])] }).weight, 11);
eq('перерыв 14+ дней → −1', suggest({ ...base, today: '2026-11-20', history: [h('2026-10-30', [s(10, 15), s(10, 15)])] }).weight, 9);
eq('Паллоф: одна сессия на верхе → ждём', suggest({ ...base, topSessions: 2, history: [h('2026-10-30', [s(3, 15), s(3, 15)]), h('2026-10-26', [s(3, 14), s(3, 15)])] }).weight, 3);
eq('Паллоф: две сессии на верхе → +1', suggest({ ...base, topSessions: 2, history: [h('2026-10-30', [s(3, 15), s(3, 15)]), h('2026-10-26', [s(3, 15), s(3, 15)])] }).weight, 4);
eq('гоблет неделя 1 без веса', suggest({ ...base, forceBodyweight: true, history: [] }).weight, null);
eq('гоблет неделя 2: вес ещё не было → калибровка', suggest({ ...base, history: [h('2026-10-26', [s(null, 15), s(null, 15)])] }).kind, 'calibration');
const RW = { min: 10, max: 15 };
eq('разведения: +1 повтор', suggest({ ...base, range: RW, mode: 'repsThenWeight', history: [h('2026-10-30', [s(2, 12), s(2, 11)])] }).targetReps, 12);
eq('разведения: 15 везде → +вес, повторы с 10', suggest({ ...base, range: RW, mode: 'repsThenWeight', history: [h('2026-10-30', [s(2, 15), s(2, 15)])] }), { kind: 'up', weight: 3, targetReps: 10, lastSets: [15, 15], reason: 'Все подходы по 15 — добавляем вес, повторы снова с 10' });
const RS = { min: 10, max: 12 };
eq('зашагивание: калибровка', suggest({ ...base, range: RS, mode: 'repsOnly', history: [] }).kind, 'calibration');
eq('зашагивание: +1 повтор', suggest({ ...base, range: RS, mode: 'repsOnly', history: [h('2026-10-30', [s(null, 10), s(null, 11)])] }).targetReps, 11);
eq('зашагивание: 2 сессии на верхе → гантели', suggest({ ...base, range: RS, mode: 'repsOnly', offerDumbbells: true, history: [h('2026-10-30', [s(null, 12), s(null, 12)]), h('2026-10-26', [s(null, 12), s(null, 12)])] }).offerDumbbells, true);

// программы по фазам
const ids = (p, ph) => programExercises(p, ph).map((e) => e.id);
eq('А, неделя 1: 6 упражнений с обычным приседом', [ids('A', 'p1').length, ids('A', 'p1')[0]], [6, 'goblet-box-squat']);
eq('А, неделя 5: + тяга гантели', ids('A', 'p2').includes('supported-row'), true);
eq('А, неделя 9: присед в медленном темпе вместо обычного', [ids('A', 'p3').includes('tempo-box-squat'), ids('A', 'p3').includes('goblet-box-squat')], [true, false]);
eq('А, неделя 9: тяга одной рукой и разгибание одной ногой', [ids('A', 'p3').includes('single-arm-pulldown'), ids('A', 'p3').includes('single-leg-extension')], [true, true]);
eq('Б, неделя 9: три замены', ['cable-lateral-raise', 'paused-cable-kickback', 'single-arm-cable-row'].every((x) => ids('B', 'p3').includes(x)), true);
eq('Б, разгрузка: те же варианты, что в неделе 12', ids('B', 'deload'), ids('B', 'p3'));
eq('Число упражнений не меняется при замене', [ids('A', 'p2').length, ids('A', 'p3').length, ids('B', 'p2').length, ids('B', 'p3').length], [7, 7, 7, 7]);
eq('День ног в фазе 3 без замен', ids('legs', 'p3')[0], 'goblet-box-squat');
eq('Анонс замен в фазе 2 и пусто в фазе 3', [upcomingSwaps('A', 'p2').length, upcomingSwaps('A', 'p3').length], [3, 0]);

// очередь тренировок недели (клуб Вт/Чт/Вс, неделя 26.10–01.11)
const { slotFor } = await import('./js/plan.js');
const ST0 = '2026-10-26';
const ses = (date, slot) => ({ date, slot, status: 'done' });
const sl = (d, plan = { days: {} }, sessions = [], today = '2026-10-26') => slotFor(d, plan, ST0, { sessions, today });
eq('по плану: Вт А, Чт кардио, Вс Б', ['2026-10-27', '2026-10-29', '2026-11-01'].map((d) => sl(d)), ['A', 'cardio', 'B']);
eq('Вт пропущен, клуб в Ср → в Ср А, Чт кардио, Вс Б',
  ['2026-10-28', '2026-10-29', '2026-11-01'].map((d) => sl(d, { days: { '2026-10-28': { type: 'gym' } } }, [], '2026-10-28')), ['A', 'cardio', 'B']);
eq('А сделана во Вт → Чт кардио, Вс Б', ['2026-10-29', '2026-11-01'].map((d) => sl(d, undefined, [ses('2026-10-27', 'A')], '2026-10-28')), ['cardio', 'B']);
eq('сделанный день показывает свою программу', sl('2026-10-27', undefined, [ses('2026-10-27', 'B')], '2026-10-30'), 'B');
eq('Вт и Чт пропущены → в Вс А', sl('2026-11-01', undefined, [], '2026-11-01'), 'A');
eq('микс во Вт заменяет А → Чт кардио, Вс Б', ['2026-10-29', '2026-11-01'].map((d) => sl(d, undefined, [ses('2026-10-27', 'legs')], '2026-10-28')), ['cardio', 'B']);
eq('вводная неделя: после вводной А — кардио', sl('2026-10-25', undefined, [ses('2026-10-23', 'A')], '2026-10-25'), 'cardio');

// бассейн и шаги
eq('аквааэробика, неделя 1: 2 круга по 30 с', [aquaPlan('p1').rounds, aquaPlan('p1').sec], [2, 30]);
eq('аквааэробика, неделя 9: 3 круга по 35 с', [aquaPlan('p3').rounds, aquaPlan('p3').sec], [3, 35]);
eq('аквааэробика: ~12–20 мин', [aquaPlan('p1').minutes >= 10, aquaPlan('p3').minutes <= 22], [true, true]);
eq('шаги из Здоровья: история S/K по дням', parseHealth('S;2026-10-23;8123\nK;2026-10-23;5,4\nS;2026-10-24;6000'), { '2026-10-23': { source: 'health', steps: 8123, km: 5.4 }, '2026-10-24': { source: 'health', steps: 6000 } });
eq('шаги из Здоровья: старый формат', parseHealth('TR;2026-10-25;9000;6,1')['2026-10-25'].km, 6.1);

// шаги ↔ километры
eq('1350 шагов = 1 км', stepsToKm(1350), 1);
eq('7400 шагов ≈ 5,48 км', stepsToKm(7400), 5.48);
eq('5 км = 6750 шагов', kmToSteps(5), 6750);
eq('прогулка с шагами: берутся введённые шаги', walkSteps({ steps: 8000, distanceKm: 5.9 }), 8000);
eq('прогулка только в км: шаги по пересчёту', walkSteps({ distanceKm: 4 }), 5400);
eq('прогулка только в шагах: км по пересчёту', walkSteps({ steps: 2700 }), 2700);

// свободные часы бассейна (неделя 02.11–08.11.2026)
const { poolFreeText, poolFreeFor } = await import('./js/plan.js');
eq('бассейн пн', poolFreeText('2026-11-02'), '13:00–14:00, 15:00–17:00');
eq('бассейн вт', poolFreeText('2026-11-03'), '10:30–13:30, 15:00–16:00');
eq('бассейн ср', poolFreeText('2026-11-04'), '13:00–14:00');
eq('бассейн чт', poolFreeText('2026-11-05'), '10:30–13:30, 15:00–16:00');
eq('бассейн пт', poolFreeText('2026-11-06'), '12:00–14:00');
eq('бассейн сб', poolFreeText('2026-11-07'), '15:00–22:00');
eq('бассейн вс — весь день', poolFreeText('2026-11-08'), 'весь день');
eq('бассейн: окна вт — два', poolFreeFor('2026-11-03').length, 2);

// санитарный день бассейна: 1-е и 3-е воскресенье месяца
const { poolClosed, effective: planDay } = await import('./js/plan.js');
eq('санитарный: 1-е воскресенье (01.11)', poolClosed('2026-11-01'), true);
eq('санитарный: 2-е воскресенье (08.11) — работает', poolClosed('2026-11-08'), false);
eq('санитарный: 3-е воскресенье (15.11)', poolClosed('2026-11-15'), true);
eq('санитарный: 4-е воскресенье (22.11) — работает', poolClosed('2026-11-22'), false);
eq('санитарный: 5-е воскресенье (29.11) — работает', poolClosed('2026-11-29'), false);
eq('санитарный: декабрь, 1-е и 3-е воскресенье', ['2026-12-06', '2026-12-13', '2026-12-20'].map((d) => poolClosed(d)), [true, false, true]);
eq('санитарный: суббота 07.11 (первая в месяце) — не закрыто', poolClosed('2026-11-07'), false);
eq('санитарный: в тексте расписания', poolFreeText('2026-11-15'), 'санитарный день — бассейн закрыт');
eq('санитарный: свободных окон нет', poolFreeFor('2026-11-15'), []);
eq('санитарный: по умолчанию «Только зал»', planDay('2026-11-15', { days: {} }).gymKind, 'gym');
eq('санитарный: выбор вручную сохраняется', planDay('2026-11-15', { days: { '2026-11-15': { gymKind: 'full' } } }).gymKind, 'full');
eq('обычное воскресенье: «Зал + бассейн»', planDay('2026-11-08', { days: {} }).gymKind, 'full');

// бассейн в подсчётах
eq('бассейн: сделан по таймеру', sessionPoolMin({ pool: { result: 'done', minutes: 30 } }), 30);
eq('бассейн: «не плавала» — 0', sessionPoolMin({ pool: { result: 'none' } }), 0);
eq('бассейн: день клуба задним числом (зал+бассейн) — 45', sessionPoolMin({ retro: true, gymKind: 'full' }), 45);
eq('бассейн: задним числом, только зал — 0', sessionPoolMin({ retro: true, gymKind: 'gym' }), 0);
eq('бассейн: плавание + аквааэробика', sessionPoolMin({ pool: { result: 'done', minutes: 20 }, aqua: { minutes: 15 } }), 35);
S.sessions = [{ date: '2026-11-01', status: 'done', retro: true, gymKind: 'full', slot: 'A' }];
S.activities = [{ date: '2026-11-01', kind: 'pool', minutes: 40 }, { date: '2026-11-02', kind: 'pool', minutes: 30 }, { date: '2026-11-03', kind: 'class', classId: 'x' }];
eq('бассейн за день: тренировка + отметка', swimMinutesOn('2026-11-01'), 85);
eq('бассейн за день: только отметка', swimMinutesOn('2026-11-02'), 30);
eq('бассейн за день: нет', swimMinutesOn('2026-11-04'), 0);
eq('визиты в клуб: бассейн и групповое считаются', clubVisitDates(), ['2026-11-01', '2026-11-02', '2026-11-03']);
S.sessions = []; S.activities = [];

// мотивация: тенденция веса и другие признаки прогресса
const { weightTrend, girthProgress, strengthGains, recentVisits, motivation } = await import('./js/stats.js');
const TD = '2026-11-14';
const wr = (date, weightKg, premenstrual = false) => ({ date, at: `${date}T07:00:00`, weightKg, premenstrual });
eq('вес: нет записей → нет тенденции', weightTrend(TD, []), null);
eq('вес: стоит (+0,2) → flat', weightTrend(TD, [wr('2026-10-25', 68.0), wr('2026-11-05', 68.2)]).kind, 'flat');
eq('вес: вырос (+1,0) → up', weightTrend(TD, [wr('2026-10-25', 67.0), wr('2026-11-08', 68.0)]).kind, 'up');
eq('вес: вырос — дельта', weightTrend(TD, [wr('2026-10-25', 67.0), wr('2026-11-08', 68.0)]).delta, 1);
eq('вес: снизился (−0,8) → down', weightTrend(TD, [wr('2026-10-25', 68.0), wr('2026-11-08', 67.2)]).kind, 'down');
eq('вес: граница ±0,5 уже не «стоит»', weightTrend(TD, [wr('2026-10-25', 68.0), wr('2026-11-08', 68.5)]).kind, 'up');
eq('вес: средняя за 2 недели, а не последняя запись', weightTrend(TD, [wr('2026-10-25', 68.0), wr('2026-11-02', 68.6), wr('2026-11-10', 68.0)]).kind, 'flat');
const pmT = weightTrend(TD, [wr('2026-10-25', 68.0), wr('2026-11-05', 68.2), wr('2026-11-10', 71.0, true)]);
eq('вес: предменструальная запись не влияет', [pmT.kind, pmT.recent, pmT.pmRecent], ['flat', 68.2, 1]);
const firstT = weightTrend(TD, [wr('2026-10-01', 70.0), wr('2026-11-10', 69.0)]);
eq('вес: нет записей за прошлые 2 недели → сравнение с первой', [firstT.kind, firstT.from], ['down', 'first']);
eq('вес: одна свежая запись — мало данных', weightTrend(TD, [wr('2026-11-10', 69.0)]), null);
eq('вес: нет свежих записей — нет тенденции', weightTrend(TD, [wr('2026-10-25', 68.0)]), null);

eq('объёмы: талия −2,5 см считается', girthProgress([{ date: '2026-10-26', waistCm: 90, hipsCm: 100, chestCm: 95 }, { date: '2026-11-23', waistCm: 87.5, hipsCm: 99.8, chestCm: 90 }]), [{ key: 'waistCm', from: 90, to: 87.5, delta: -2.5 }]);
eq('объёмы: один замер — сравнивать не с чем', girthProgress([{ date: '2026-10-26', waistCm: 90 }]), []);

const setOf = (exerciseId, weight, reps, extra = {}) => ({ exerciseId, weight, reps, unit: 'plate', ...extra });
const sg = strengthGains([
  { date: '2026-10-27', status: 'done', sets: [setOf('a', 3, 12), setOf('a', 50, 10, { isWarmup: true }), setOf('c', 10, 10, { unit: 'kg' }), setOf('b', 5, 10)] },
  { date: '2026-11-10', status: 'done', sets: [setOf('a', 4, 12), setOf('c', 10, 10, { unit: 'kg' })] },
  { date: '2026-11-12', status: 'skip', sets: [setOf('a', 9, 12)] },
]);
eq('сила: лучше в 1 из 2 сравнимых упражнений', [sg.improved, sg.compared], [1, 2]);
eq('сила: лучший пример — упражнение a, 3 → 4 плит.', [sg.best.exerciseId, sg.best.unit, sg.best.from.weight, sg.best.to.weight], ['a', 'plate', 3, 4]);
eq('сила: нет тренировок — нет данных', strengthGains([]), { improved: 0, compared: 0, best: null });

S.sessions = ['2026-10-10', '2026-10-20', '2026-10-27', '2026-11-03', '2026-11-10'].map((date) => ({ date, status: 'done', slot: 'A', sets: [] }));
eq('визиты за 28 дней: старые не считаются', recentVisits(TD, 28), 4);

// всё вместе: вес вырос, но силовая, объёмы и визиты улучшились
S.sessions = [
  { date: '2026-10-27', status: 'done', slot: 'A', sets: [setOf('a', 3, 12)] },
  { date: '2026-11-03', status: 'done', slot: 'B', sets: [] },
  { date: '2026-11-05', status: 'done', slot: 'cardio', sets: [] },
  { date: '2026-11-10', status: 'done', slot: 'A', sets: [setOf('a', 4, 12)] },
];
S.measurements = [wr('2026-10-25', 67.0), wr('2026-11-08', 68.0), { date: '2026-10-26', waistCm: 90 }, { date: '2026-11-12', waistCm: 88 }];
const mo = motivation(TD);
eq('мотивация: вес вырос → up, нужна поддержка', [mo.kind, mo.support], ['up', true]);
eq('мотивация: найдены визиты, сила и объёмы', mo.proofs.map((p) => p.type), ['visits', 'strength', 'girth']);
S.measurements = [wr('2026-10-25', 68.0), wr('2026-11-08', 67.0)];
eq('мотивация: вес снизился — поддержка на главной не нужна', [motivation(TD).kind, motivation(TD).support], ['down', false]);
S.measurements = [];
eq('мотивация: нет записей веса — none, без поддержки', [motivation(TD).kind, motivation(TD).support], ['none', false]);
S.sessions = []; S.measurements = []; S.activities = [];

// счётчики главной: визиты за месяц и всего

eq('сет: нет тяги — предложить тягу, а предложения — тяги', (() => { const i = setA(['goblet-box-squat', 'leg-extension', 'chest-press', 'dead-bug']).issues.find((x) => x.id === 'no-pull'); return !!i && i.suggest.every((id) => roleOf(id) === 'pull'); })(), true);
eq('сет: только бицепс — тяги (спины) всё равно нет', issueIds(setA(['goblet-box-squat', 'dumbbell-curl', 'cable-curl', 'chest-press'])).includes('no-pull'), true);
eq('сет: жимов много, тяг мало', issueIds(setA(['chest-press', 'pec-deck', 'lateral-raise', 'seated-row', 'goblet-box-squat'])).includes('push-over-pull'), true);
eq('сет: перед бедра без задней поверхности', issueIds(setA(['goblet-box-squat', 'leg-extension', 'lat-pulldown', 'chest-press'])).includes('no-hams'), true);
eq('сет: всё на одну группу — «убери лишнее»', (() => { const r = setA(['goblet-box-squat', 'leg-extension', 'seated-leg-curl', 'standing-calf-raise']); const i = r.issues.find((x) => x.type === 'remove' && x.id === 'too-much-legs'); return !!i && !!i.dropId; })(), true);
eq('сет: близнецы на одном тренажёре', issueIds(setA(['leg-extension', 'single-leg-extension'])).some((x) => x.startsWith('twin-')), true);
eq('сет: осторожное упражнение помечается', setA(['cable-kickback']).issues.some((x) => x.type === 'care'), true);
eq('сет: меньше трёх упражнений — не требуем полноты', setA(['lat-pulldown', 'seated-row']).issues.filter((x) => x.type === 'add').length, 0);
eq('сет: время — подходы × (работа + отдых)', setA(['goblet-box-squat', 'seated-leg-curl', 'lat-pulldown', 'chest-press']).minutes, 27);
eq('сет: пары идут по порядку', setA(BALANCED).pairs.map((x) => x.a + '>' + x.b), ['goblet-box-squat>seated-leg-curl', 'seated-leg-curl>lat-pulldown', 'lat-pulldown>chest-press', 'chest-press>dead-bug']);
eq('сет: неизвестное упражнение пропускается', setA(['aqua-squat', ...BALANCED]).count, 5);

const wfs = workoutFromSet(['cable-kickback', 'cable-kickback', 'нет-такого', 'lateral-raise'], ['cable-kickback', 'lateral-raise']);
eq('сет → тренировка: порядок сохраняется, повторы и неизвестные убираются', [wfs.order, wfs.dropped], [['cable-kickback', 'lateral-raise'], ['нет-такого']]);
eq('сет → тренировка: недоступное в этой фазе отбрасывается', workoutFromSet(['cable-kickback', 'lateral-raise'], ['lateral-raise']).dropped, ['cable-kickback']);
eq('сет → тренировка: пустой сет — пустая тренировка', workoutFromSet([], ['lateral-raise']).order, []);
eq('«Мой сет» — силовая программа с названием', [isStrength('custom'), programName('custom')], [true, 'Мой сет']);
const ssPair = { a: 'lateral-raise', b: 'cable-kickback' };
eq('суперсет: после A идёт B с коротким отдыхом', supersetStep(ssPair, 'lateral-raise', () => false), { next: 'cable-kickback', short: true });
eq('суперсет: после B снова A с полным отдыхом', supersetStep(ssPair, 'cable-kickback', () => false), { next: 'lateral-raise', short: false });
eq('суперсет: B закончено — после A обычный порядок', supersetStep(ssPair, 'lateral-raise', (id) => id === 'cable-kickback'), null);
eq('суперсет: оба закончены или чужое упражнение — обычный порядок', [supersetStep(ssPair, 'cable-kickback', () => true), supersetStep(ssPair, 'step-up', () => false), supersetStep(null, 'step-up', () => false)], [null, null, null]);
eq('суперсет: можно верх + низ и нельзя одну и ту же мышцу', [canSuperset('lateral-raise', 'cable-kickback'), canSuperset('cable-kickback', 'hip-abduction')], [true, false]);
eq('суперсет: короткий отдых зависит от обычного', [pairRestSec(90), pairRestSec(60)], [50, 35]);
eq('без коврика: упражнение с ковриком отмечается, остальные нет', [needsEquipment('dead-bug', ['mat']), needsEquipment('cable-woodchop', ['mat']), needsEquipment('dead-bug', [])], [true, false, false]);
eq('без коврика: список очищается от упражнений на полу', withoutEquipment(['dead-bug', 'bird-dog', 'pallof-press'], ['mat']), ['pallof-press']);
const noMatCore = ['dead-bug', 'bird-dog'].map((id) => analogMachines(id, { available: withoutEquipment(Object.keys(EXERCISE_META), ['mat']), limit: 8 }).map((o) => o.id));
eq('без коврика: у «мёртвого жука» и «птицы-собаки» не меньше трёх аналогов без пола', noMatCore.map((l) => l.length >= 3), [true, true]);
eq('без коврика: среди аналогов нет упражнений на коврике', noMatCore.flat().filter((id) => needsEquipment(id, ['mat'])), []);
eq('пресс: не меньше трёх упражнений без коврика', Object.entries(EXERCISE_META).filter(([id, m]) => m.primary.some((x) => ['abs', 'core-deep', 'obliques'].includes(x)) && !m.equipment.includes('mat')).length >= 6, true);
eq('новые упражнения: обратные отжимания «осторожно» (натуживание) для глаз', verdict('reverse-bench-dip', ['eyes']).level, 'caution');
eq('новые упражнения: выпады и сумо без ограничений для глаз', ['dumbbell-forward-lunge', 'dumbbell-reverse-lunge', 'dumbbell-cross-lunge', 'dumbbell-sumo-squat', 'cable-woodchop', 'dumbbell-side-bend'].map((id) => verdict(id, ['eyes']).level), ['ok', 'ok', 'ok', 'ok', 'ok', 'ok']);
const mkS = (date, ids, n = 3) => ({ date, sets: ids.flatMap((exerciseId) => Array.from({ length: n }, () => ({ exerciseId, isWarmup: false }))) });
const GL = ['cable-kickback', 'paused-cable-kickback', 'hip-abduction', 'cable-hip-abduction'];
const histB = (sessions, today = '2026-11-18') => historyBalance(sessions, today);
const hbTypes = (r) => r.warnings.map((w) => w.type + ':' + w.group);
eq('баланс: пусто — без предупреждений', [histB([]).warnings, histB([]).total], [[], 0]);
eq('баланс: только ягодицы через день — перекос и «три подряд»', (() => { const r = histB([mkS('2026-11-12', GL), mkS('2026-11-14', GL), mkS('2026-11-16', GL)]); return [hbTypes(r).includes('overload:glutes'), hbTypes(r).includes('streak:glutes')]; })(), [true, true]);
eq('баланс: ягодицы два дня подряд — нужен отдых 48 ч', hbTypes(histB([mkS('2026-11-17', GL), mkS('2026-11-18', GL)])).includes('rest48:glutes'), true);
eq('баланс: ягодицы с интервалом в два дня — без «48 ч»', hbTypes(histB([mkS('2026-11-14', GL), mkS('2026-11-16', GL)])).some((x) => x.startsWith('rest48')), false);
eq('баланс: чередование А и Б — без перекоса, «подряд» и «48 ч»', (() => { const A = programExercises('A', 'p3').map((e) => e.id), B = programExercises('B', 'p3').map((e) => e.id); const r = histB([mkS('2026-11-04', A), mkS('2026-11-06', B), mkS('2026-11-11', A), mkS('2026-11-13', B)]); return r.warnings.filter((w) => ['overload', 'streak', 'rest48'].includes(w.type)); })(), []);
eq('баланс: старше 14 дней не считается', histB([mkS('2026-10-20', GL)]).total, 0);
eq('баланс: разминка не считается', histB([{ date: '2026-11-17', sets: [{ exerciseId: 'cable-kickback', isWarmup: true }] }]).total, 0);
eq('баланс: доли в сумме дают единицу', Math.abs(Object.values(histB([mkS('2026-11-16', GL.concat(BALANCED))]).shares).reduce((a, b) => a + b, 0) - 1) < 1e-9, true);
eq('баланс: давно не было спины — подсказка', (() => { const r = histB([mkS('2026-11-10', GL), mkS('2026-11-16', ['goblet-box-squat', 'leg-extension', 'seated-leg-curl', 'chest-press', 'dead-bug'])]); return hbTypes(r).includes('missing:back'); })(), true);
eq('доступные упражнения: фаза 1 без вариаций и воды', [availableExerciseIds('p1').includes('goblet-box-squat'), availableExerciseIds('p1').includes('tempo-box-squat'), availableExerciseIds('p1').includes('aqua-squat')], [true, false, false]);
eq('доступные упражнения: «Закрепление» с вариациями', availableExerciseIds('p3').includes('tempo-box-squat'), true);


// состав тела
const BR = bodyRecords([{ id: 'w', weightKg: 60 }, ...HISTORY_SEED].reverse());
eq('состав тела: берутся только записи анализа, от старых к новым', BR.map((r) => r.date), ['2011-08-08', '2013-04-11', '2015-01-27', '2026-11-21']);
eq('состав тела: приборы различаются', devicesUsed(BR), ['vesna', 'inbody']);
eq('состав тела: изменение считается внутри старого прибора', (() => { const c = bodyChange(BR, 'vesna'); return [c.from, c.to, c.fatKg, c.muscleKg, c.bodyKg]; })(), ['2013-04-11', '2015-01-27', 2, 0.5, 3]);
eq('состав тела: одна запись прибора — сравнивать не с чем', bodyChange(BR, 'inbody'), null);
eq('состав тела: InBody не сравнивается со старым прибором', bodyChange(BR.filter((r) => r.device === 'inbody' || r.date === '2015-01-27'), 'inbody'), null);
eq('состав тела: следующий анализ через 28 дней', (() => { const d = bodyDue(BR, '2026-12-01'); return [d.next, d.daysLeft, d.due]; })(), ['2026-12-19', 18, false]);
eq('состав тела: пора, когда прошло 28 дней', bodyDue(BR, '2026-12-19').due, true);
eq('состав тела: пусто — напоминания нет', bodyDue([], '2026-12-01'), null);
eq('состав тела: до 28 % при тех же мышцах около 5,4 кг жира', fatToTarget(HISTORY_SEED[3], 28), 5.4);
eq('состав тела: ниже цели — ноль, нет данных — null', [fatToTarget({ bodyKg: 60, fatKg: 12 }, 28), fatToTarget({ bodyKg: 60 }, 28)], [0, null]);
eq('состав тела: зона по проценту жира', [fatZone(33.7), fatZone(25), fatZone(15)], ['above', 'in', 'below']);
eq('состав тела: проверка записи', [checkBodyRecord(HISTORY_SEED[3]), checkBodyRecord({ ...HISTORY_SEED[3], fatKg: 70 }), checkBodyRecord({ ...HISTORY_SEED[3], fatPct: 20 }), checkBodyRecord({ ...HISTORY_SEED[3], device: 'x' }), checkBodyRecord({ ...HISTORY_SEED[3], muscleKg: 0 })], [null, 'Жир не может быть больше веса', 'Процент жира не сходится с кг: проверь цифры', 'Выбери прибор', 'Нужны вес, жир и мышцы в кг']);
eq('состав тела: бланки внесены без ошибок', HISTORY_SEED.map(checkBodyRecord), [null, null, null, null]);
eq('состав тела: у записей анализа нет полей веса и талии, которые читают «Вес» и «Талия»', HISTORY_SEED.filter((r) => ['weightKg', 'waistCm', 'bellyNavelCm', 'hipsCm', 'chestCm', 'thighCm', 'checkpoint'].some((k) => k in r)).length, 0);
eq('состав тела: все записи помечены kind body', HISTORY_SEED.every((r) => r.kind === 'body'), true);

out.innerHTML = `<b>${fail ? `<span class="fail">Провалено: ${fail}</span>` : '<span class="ok">Все тесты прошли</span>'} · пройдено ${pass}</b>\n\n` + out.innerHTML;
document.title = fail ? `FAIL ${fail}` : `OK ${pass}`;
</script>
</body>
