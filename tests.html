<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Тесты логики</title>
<style>body{font-family:system-ui;padding:16px}.ok{color:#0a6b3d}.fail{color:#b3261e;font-weight:700}</style></head>
<body>
<h1>Тесты логики</h1>
<pre id="out"></pre>
<script type="module">
import * as cy from './js/cycle.js';
import { suggest } from './js/progression.js';
import { programExercises, upcomingSwaps, aquaPlan } from './js/programs.js';
import { parseHealth } from './js/stats.js';

const out = document.getElementById('out');
let pass = 0, fail = 0;
function eq(name, got, want) {
  const ok = JSON.stringify(got) === JSON.stringify(want);
  ok ? pass++ : fail++;
  out.innerHTML += `<span class="${ok ? 'ok' : 'fail'}">${ok ? '✓' : '✗'} ${name}${ok ? '' : ` — получено ${JSON.stringify(got)}, ожидалось ${JSON.stringify(want)}`}</span>\n`;
}

const START = '2026-10-26';
// недели и фазы
eq('23.10 — вводная неделя 0', cy.weekOf('2026-10-23', START), 0);
eq('26.10 — неделя 1', cy.weekOf('2026-10-26', START), 1);
eq('01.11 (вс) — неделя 1', cy.weekOf('2026-11-01', START), 1);
eq('09.11 — неделя 3', cy.weekOf('2026-11-09', START), 3);
eq('23.11 — неделя 5', cy.weekOf('2026-11-23', START), 5);
eq('18.01 — неделя 13', cy.weekOf('2027-01-18', START), 13);
eq('сдвиг на неделю с недели 3', cy.weekOf('2026-11-16', START, [{ fromRawWeek: 3, weeks: 1 }]), 3);
eq('фаза недели 4', cy.phaseOf(4), 'p1');
eq('фаза недели 5', cy.phaseOf(5), 'p2');
eq('фаза недели 13', cy.phaseOf(13), 'deload');
eq('подходы: неделя 0', cy.setsFor(0, 'p1'), 2);
eq('подходы: неделя 1', cy.setsFor(1, 'p1'), 2);
eq('подходы: неделя 3', cy.setsFor(3, 'p1'), 3);
eq('подходы: неделя 5', cy.setsFor(5, 'p2'), 3);
eq('подходы: неделя 13', cy.setsFor(13, 'deload'), 2);
eq('контрольный замер 23.10 → 0', cy.checkpointNear('2026-10-23', START), 0);
eq('контрольный замер 23.11 → 4', cy.checkpointNear('2026-11-23', START), 4);
eq('не контрольный день', cy.checkpointNear('2026-11-05', START), null);
eq('день недели 23.10 = пятница', cy.weekday('2026-10-23'), 5);
eq('начало недели 23.10', cy.weekStart('2026-10-23'), '2026-10-19');

// какую тренировку предложить
eq('пятница вводной недели → А', cy.plannedSlot('2026-10-23', 0, new Set()).slot, 'A');
eq('вторник → А по расписанию', cy.plannedSlot('2026-10-27', 1, new Set()), { slot: 'A', scheduled: true });
eq('среда после пропущенного Вт → А вне расписания', cy.plannedSlot('2026-10-28', 1, new Set()), { slot: 'A', scheduled: false });
eq('воскресенье, А и кардио сделаны → Б', cy.plannedSlot('2026-11-01', 1, new Set(['A', 'cardio'])), { slot: 'B', scheduled: true });
eq('четверг, А не сделана → кардио по плану', cy.plannedSlot('2026-10-29', 1, new Set()).slot, 'cardio');

// подсказка веса
const R = { min: 12, max: 15 };
const s = (weight, reps, breathHold = false) => ({ weight, reps, breathHold });
const h = (date, sets, extra = {}) => ({ date, phase: 'p1', sets, ...extra });
const base = { range: R, step: 1, mode: 'double', today: '2026-11-02' };
eq('калибровка без истории', suggest({ ...base, history: [] }).kind, 'calibration');
eq('все на верхе → +1', suggest({ ...base, history: [h('2026-10-30', [s(10, 15), s(10, 15)])] }).weight, 11);
eq('breathHold → −1', suggest({ ...base, history: [h('2026-10-30', [s(10, 15), s(10, 15, true)])] }).weight, 9);
eq('меньше минимума → тот же, добрать', suggest({ ...base, history: [h('2026-10-30', [s(10, 13), s(10, 11)])] }), { kind: 'addReps', weight: 10, lastSets: [13, 11], reason: 'Тот же вес — добрать повторы' });
eq('внутри диапазона → тот же', suggest({ ...base, history: [h('2026-10-30', [s(10, 14), s(10, 13)])] }).weight, 10);
eq('лёгкий день не учитывается', suggest({ ...base, history: [h('2026-10-31', [s(8, 15), s(8, 15)], { lightDay: true }), h('2026-10-30', [s(10, 13), s(10, 13)])] }).weight, 10);
eq('разгрузка не учитывается', suggest({ ...base, history: [h('2026-10-31', [s(8, 12)], { phase: 'deload' }), h('2026-10-30', [s(10, 15), s(10, 15)])] }).weight, 11);
eq('перерыв 14+ дней → −1', suggest({ ...base, today: '2026-11-20', history: [h('2026-10-30', [s(10, 15), s(10, 15)])] }).weight, 9);
eq('Паллоф: одна сессия на верхе → ждём', suggest({ ...base, topSessions: 2, history: [h('2026-10-30', [s(3, 15), s(3, 15)]), h('2026-10-26', [s(3, 14), s(3, 15)])] }).weight, 3);
eq('Паллоф: две сессии на верхе → +1', suggest({ ...base, topSessions: 2, history: [h('2026-10-30', [s(3, 15), s(3, 15)]), h('2026-10-26', [s(3, 15), s(3, 15)])] }).weight, 4);
eq('гоблет неделя 1 без веса', suggest({ ...base, forceBodyweight: true, history: [] }).weight, null);
eq('гоблет неделя 2: вес ещё не было → калибровка', suggest({ ...base, history: [h('2026-10-26', [s(null, 15), s(null, 15)])] }).kind, 'calibration');
const RW = { min: 10, max: 15 };
eq('разведения: +1 повтор', suggest({ ...base, range: RW, mode: 'repsThenWeight', history: [h('2026-10-30', [s(2, 12), s(2, 11)])] }).targetReps, 12);
eq('разведения: 15 везде → +вес, повторы с 10', suggest({ ...base, range: RW, mode: 'repsThenWeight', history: [h('2026-10-30', [s(2, 15), s(2, 15)])] }), { kind: 'up', weight: 3, targetReps: 10, lastSets: [15, 15], reason: 'Все подходы по 15 — добавляем вес, повторы снова с 10' });
const RS = { min: 10, max: 12 };
eq('зашагивание: калибровка', suggest({ ...base, range: RS, mode: 'repsOnly', history: [] }).kind, 'calibration');
eq('зашагивание: +1 повтор', suggest({ ...base, range: RS, mode: 'repsOnly', history: [h('2026-10-30', [s(null, 10), s(null, 11)])] }).targetReps, 11);
eq('зашагивание: 2 сессии на верхе → гантели', suggest({ ...base, range: RS, mode: 'repsOnly', offerDumbbells: true, history: [h('2026-10-30', [s(null, 12), s(null, 12)]), h('2026-10-26', [s(null, 12), s(null, 12)])] }).offerDumbbells, true);

// программы по фазам
const ids = (p, ph) => programExercises(p, ph).map((e) => e.id);
eq('А, неделя 1: 6 упражнений с обычным приседом', [ids('A', 'p1').length, ids('A', 'p1')[0]], [6, 'goblet-box-squat']);
eq('А, неделя 5: + тяга гантели', ids('A', 'p2').includes('supported-row'), true);
eq('А, неделя 9: присед в медленном темпе вместо обычного', [ids('A', 'p3').includes('tempo-box-squat'), ids('A', 'p3').includes('goblet-box-squat')], [true, false]);
eq('А, неделя 9: тяга одной рукой и разгибание одной ногой', [ids('A', 'p3').includes('single-arm-pulldown'), ids('A', 'p3').includes('single-leg-extension')], [true, true]);
eq('Б, неделя 9: три замены', ['cable-lateral-raise', 'paused-cable-kickback', 'single-arm-cable-row'].every((x) => ids('B', 'p3').includes(x)), true);
eq('Б, разгрузка: те же варианты, что в неделе 12', ids('B', 'deload'), ids('B', 'p3'));
eq('Число упражнений не меняется при замене', [ids('A', 'p2').length, ids('A', 'p3').length, ids('B', 'p2').length, ids('B', 'p3').length], [7, 7, 7, 7]);
eq('День ног в фазе 3 без замен', ids('legs', 'p3')[0], 'goblet-box-squat');
eq('Анонс замен в фазе 2 и пусто в фазе 3', [upcomingSwaps('A', 'p2').length, upcomingSwaps('A', 'p3').length], [3, 0]);

// очередь тренировок недели (клуб Вт/Чт/Вс, неделя 26.10–01.11)
const { slotFor } = await import('./js/plan.js');
const ST0 = '2026-10-26';
const ses = (date, slot) => ({ date, slot, status: 'done' });
const sl = (d, plan = { days: {} }, sessions = [], today = '2026-10-26') => slotFor(d, plan, ST0, { sessions, today });
eq('по плану: Вт А, Чт кардио, Вс Б', ['2026-10-27', '2026-10-29', '2026-11-01'].map((d) => sl(d)), ['A', 'cardio', 'B']);
eq('Вт пропущен, клуб в Ср → в Ср А, Чт кардио, Вс Б',
  ['2026-10-28', '2026-10-29', '2026-11-01'].map((d) => sl(d, { days: { '2026-10-28': { type: 'gym' } } }, [], '2026-10-28')), ['A', 'cardio', 'B']);
eq('А сделана во Вт → Чт кардио, Вс Б', ['2026-10-29', '2026-11-01'].map((d) => sl(d, undefined, [ses('2026-10-27', 'A')], '2026-10-28')), ['cardio', 'B']);
eq('сделанный день показывает свою программу', sl('2026-10-27', undefined, [ses('2026-10-27', 'B')], '2026-10-30'), 'B');
eq('Вт и Чт пропущены → в Вс А', sl('2026-11-01', undefined, [], '2026-11-01'), 'A');
eq('микс во Вт заменяет А → Чт кардио, Вс Б', ['2026-10-29', '2026-11-01'].map((d) => sl(d, undefined, [ses('2026-10-27', 'legs')], '2026-10-28')), ['cardio', 'B']);
eq('вводная неделя: после вводной А — кардио', sl('2026-10-25', undefined, [ses('2026-10-23', 'A')], '2026-10-25'), 'cardio');

// бассейн и шаги
eq('аквааэробика, неделя 1: 2 круга по 30 с', [aquaPlan('p1').rounds, aquaPlan('p1').sec], [2, 30]);
eq('аквааэробика, неделя 9: 3 круга по 35 с', [aquaPlan('p3').rounds, aquaPlan('p3').sec], [3, 35]);
eq('аквааэробика: ~12–20 мин', [aquaPlan('p1').minutes >= 10, aquaPlan('p3').minutes <= 22], [true, true]);
eq('шаги из Здоровья: история S/K по дням', parseHealth('S;2026-10-23;8123\nK;2026-10-23;5,4\nS;2026-10-24;6000'), { '2026-10-23': { source: 'health', steps: 8123, km: 5.4 }, '2026-10-24': { source: 'health', steps: 6000 } });
eq('шаги из Здоровья: старый формат', parseHealth('TR;2026-10-25;9000;6,1')['2026-10-25'].km, 6.1);

out.innerHTML = `<b>${fail ? `<span class="fail">Провалено: ${fail}</span>` : '<span class="ok">Все тесты прошли</span>'} · пройдено ${pass}</b>\n\n` + out.innerHTML;
document.title = fail ? `FAIL ${fail}` : `OK ${pass}`;
</script>
</body>
</html>
